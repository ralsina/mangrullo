version: '3.8'

services:
  mangrullo:
    image: ghcr.io/ralsina/mangrullo-arm64:latest
    container_name: mangrullo
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MANGRULLO_LOG_LEVEL=info
      - MANGRULLO_INTERVAL=3600
      - MANGRULLO_ALLOW_MAJOR=false
      - MANGRULLO_HEALTH_PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mangrullo-web:
    image: ghcr.io/ralsina/mangrullo-arm64:latest
    container_name: mangrullo-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MANGRULLO_LOG_LEVEL=info
      - MANGRULLO_INTERVAL=3600
      - MANGRULLO_ALLOW_MAJOR=false
    command: ["web"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
