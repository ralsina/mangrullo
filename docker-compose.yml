version: '3.8'

services:
  mangrullo:
    image: ghcr.io/ralsina/mangrullo:latest-arm64
    container_name: mangrullo
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MANGRULLO_LOG_LEVEL=info
      - MANGRULLO_INTERVAL=3600
      - MANGRULLO_ALLOW_MAJOR=false

  mangrullo-web:
    image: ghcr.io/ralsina/mangrullo-arm64:latest
    container_name: mangrullo-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MANGRULLO_LOG_LEVEL=info
      - MANGRULLO_INTERVAL=3600
      - MANGRULLO_ALLOW_MAJOR=false
    command: ["web"]